<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'">
  <title>didelo.fr status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>didelo.fr status</h1>
    <p id="banner" class="banner" role="status">Loading…</p>
    <div id="targets"></div>
    <noscript><p>This page needs JavaScript to show the checks.</p></noscript>
  </main>
  <footer>
    <p>Probed from GitHub, outside the server, every 15 minutes. <span id="updated"></span></p>
    <p><a href="https://metrics.didelo.fr">Detailed metrics</a>: CPU, memory and response times. That page runs on the server it watches, so if it does not answer, the server is down.</p>
    <p><a href="https://github.com/Didelo-lilian/status">How it works</a> · <a href="https://github.com/Didelo-lilian/infra">The infrastructure</a></p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
